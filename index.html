<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>html,body{margin:0;padding:0}[hidden]{display:none!important}#getCsv{display:none!important}</style>
<script>
/* REMWO Telegram adapter: gives the site app the same storage calls it had on Claude,
   but backed by the REMWO Apps Script (Google Sheets + Drive). Telegram signs every call. */
(function () {
  var TG = window.Telegram && Telegram.WebApp;
  if (TG) { try { TG.ready(); TG.expand(); if (TG.disableVerticalSwipes) TG.disableVerticalSwipes(); } catch (e) { } }
  var qs = new URLSearchParams(location.search);
  var API = qs.get('api') || localStorageGet('remwo_api') || '';
  if (qs.get('api')) localStorageSet('remwo_api', qs.get('api'));
  var PROJECT = qs.get('project') || localStorageGet('remwo_project') || '';
  function localStorageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }

  async function call(action, extra) {
    if (!API) throw { code: 'no_api' };
    var body = Object.assign({ action: action, project: PROJECT, initData: TG ? TG.initData : '' }, extra || {});
    var r = await fetch(API, { method: 'POST', body: JSON.stringify(body) });       // text/plain: no CORS preflight
    var j = await r.json();
    if (!j.ok) throw { code: j.error || 'error', info: j };
    return j;
  }
  window.REMWO = { call: call };

  var who = null, whoErr = null, ready = call('me').then(function (j) { who = j; if (!PROJECT && j.projects[0]) PROJECT = j.projects[0].code; }).catch(function (e) { whoErr = e; });

  /* fetch('/_blob/plan' | '/_blob/model:...') -> Drive files through the API */
  var realFetch = window.fetch.bind(window);
  window.fetch = async function (url, opt) {
    var u = String(url);
    if (u.indexOf('/_blob/') === 0) {
      if (opt && opt.method === 'HEAD') return new Response('', { headers: { Date: new Date().toUTCString() } });   // server stamps the time itself
      var j = await call('file', { name: u.slice(7) });
      return new Response(j.text || '', { status: j.text ? 200 : 404, headers: { 'Content-Type': 'application/json' } });
    }
    return realFetch(url, opt);
  };

  function snap(docs) { return { docs: docs.map(function (d) { return { id: d._id, data: function () { return d; } }; }) }; }
  function poller(fn, ms, onData, onErr) {
    var stop = false;
    (async function loop() { while (!stop) { try { onData(await fn()); } catch (e) { if (onErr) onErr(e); } await new Promise(function (r) { setTimeout(r, ms); }); } })();
    return function () { stop = true; };
  }
  var kicks = {};
  var db = {
    doc: function (path) {
      if (path === 'plan/current') {
        var get = async function () { var j = await call('plan'); return { exists: !!j.doc, data: function () { return j.doc; } }; };
        return { get: get, set: async function () { return true; }, onSnapshot: function (f, e) { return poller(get, 300000, f, e); } };
      }
      if (path.indexOf('photos/') === 0) {
        var id = path.slice(7);
        return { get: async function () { var j = await call('photo_get', { id: id }); return { exists: !!j.data, data: function () { return { data: j.data }; } }; } };
      }
      return { get: async function () { return { exists: false, data: function () { return null; } }; } };
    },
    collection: function (name) {
      var list = async function () { var j = await call('list', { coll: name }); return snap(j.docs); };
      var c = {
        add: async function (body) {
          if (name === 'photos') { var p = await call('photo_add', { body: body }); return { id: p.id }; }
          var j = await call('add', { coll: name, body: body }); setTimeout(function () { (kicks[name] || []).forEach(function (k) { k(); }); }, 300); return { id: j.id };
        },
        get: list,
        orderBy: function () { return c; }, limit: function () { return c; },
        onSnapshot: function (f, e) { var s = poller(list, 60000, f, e); (kicks[name] = kicks[name] || []).push(function () { list().then(f).catch(function () { }); }); return s; }
      };
      return c;
    }
  };
  var user = {
    id: async function () { return who ? who.me.id : null; },
    me: async function () { return who ? { name: who.me.name + (who.projects.length > 1 ? ' · ' + PROJECT : '') } : null; },
    canEdit: async function () { return !!(who && (who.me.role === 'Owner' || who.me.role === 'Office')); },
    profiles: async function (ids) { var j = await call('profiles', { ids: ids }); var o = {}; ids.forEach(function (i) { o[i] = { name: j.names[i] }; }); return o; }
  };
  var assets = {
    upload: async function (blob) {
      var txt = await blob.text(), kind = txt.indexOf('"remwo-web-1"') >= 0 ? 'model' : 'plan';
      await call('upload', { kind: kind, text: txt });
      return { id: kind, url: '/_blob/' + kind };
    }
  };
  window.claude = {
    use: async function (name) {
      await ready;
      if (whoErr || !who) { showBlock(); return null; }
      if (name === 'db') return db;
      if (name === 'user') return user;
      if (name === 'assets') return assets;
      return null;
    }
  };
  function showBlock() {
    var e = whoErr || {}, msg;
    if (e.code === 'not_in_telegram' || !API) msg = 'Open this from the <b>REMWO Site</b> bot in Telegram (tap <b>Site app</b>).';
    else if (e.code === 'not_staff') msg = 'Hello ' + (e.info && e.info.name || '') + '. You are not on the REMWO staff list yet. Ask the office to add your Telegram username' + (e.info && e.info.username ? ' (@' + e.info.username + ')' : '') + ' to REMWO Ops › Staff.';
    else if (e.code === 'session_expired') msg = 'This session is old. Close the app and open it again from the bot.';
    else msg = 'Could not reach the REMWO server (' + (e.code || 'network') + '). Check the internet and reopen.';
    var tryIt = function () { var m = document.getElementById('main'); if (m) m.innerHTML = '<div class="note" style="margin-top:10px">' + msg + '</div>'; var s = document.getElementById('msg'); if (s) s.textContent = ''; };
    setTimeout(tryIt, 0); setTimeout(tryIt, 500);
  }
})();

</script>

<title>RPQS Site App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: the model fills the screen; a bottom panel carries today's list, and tapping a piece opens its card there with three big answers. */
:root {
  --bg: #eef1ee;
  --card: #fbfcfa;
  --ink: #1b272c;
  --muted: #5b696e;
  --line: #d2d9d4;
  --accent: #1f5e8c;
  --accent-ink: #ffffff;
  --done: #2f8a4f;
  --prog: #b9800f;
  --hold: #c0392b;
  --ready: #2d6fb8;
  --wait: #8f948f;
  --soft: #dfe8ef;
  --scene: #e3e8e4;
  --hl: #ff7a1a;
  --ctx: #cfd5d0;
  --font: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12191c; --card: #1a2428; --ink: #e4ebe7; --muted: #97a6aa; --line: #2d3a3f; --accent: #7fb6e3; --accent-ink: #0f1a20;
  --done: #4fb874; --prog: #e0a63a; --hold: #e2604f; --ready: #5d9be0; --wait: #7b827e; --soft: #22384a; --scene: #10171a; --hl: #ff8c3a; --ctx: #3a4549; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12191c; --card: #1a2428; --ink: #e4ebe7; --muted: #97a6aa; --line: #2d3a3f; --accent: #7fb6e3; --accent-ink: #0f1a20;
  --done: #4fb874; --prog: #e0a63a; --hold: #e2604f; --ready: #5d9be0; --wait: #7b827e; --soft: #22384a; --scene: #10171a; --hl: #ff8c3a; --ctx: #3a4549; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.35 var(--font); }
body { overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { flex: none; padding-block: 8px 6px; display: grid; gap: 6px; background: var(--bg); }
.stage { flex: 1 1 auto; position: relative; min-height: 0; background: var(--scene); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage .msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 20px; text-align: center; }
.tools { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; display: grid; gap: 6px; }
.tools button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 8px 10px; font: 600 14px var(--font); cursor: pointer; }
.legend { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--ink); background: color-mix(in srgb, var(--card) 85%, transparent); border-radius: 10px; padding: 6px 8px; max-width: 70%; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.panel { flex: none; max-height: 46%; overflow-y: auto; background: var(--bg); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; margin-top: -12px; position: relative; z-index: 2; padding-block: 0 calc(16px + env(safe-area-inset-bottom, 0px)); transition: max-height .2s; }
.panel.tall { max-height: 60%; }
.panel.min { max-height: 64px; overflow: hidden; }
.grip { display: block; margin: 6px auto 4px; width: 56px; height: 18px; border: 0; background: none; cursor: pointer; }
.grip::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .01em; text-wrap: balance; }
.brand small { color: var(--muted); font-size: 13px; text-align: right; }
.rooms { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: 500 15px var(--font); cursor: pointer; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tabs button { border: 0; border-radius: 10px; padding: 10px; font: 600 15px var(--font); background: var(--soft); color: var(--ink); cursor: pointer; }
.tabs button.on { background: var(--ink); color: var(--bg); }
.note { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; color: var(--muted); }
.tabs { margin-top: 2px; }
section.grp { margin-top: 14px; display: grid; gap: 8px; }
section.grp h2 { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
section.grp h2 i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.row { display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 12px 0; text-align: left; width: 100%; font: inherit; color: inherit; cursor: pointer; overflow: hidden; }
.row .bar { align-self: stretch; border-radius: 0 4px 4px 0; }
.row b { display: block; font-size: 17px; font-weight: 600; }
.row span.sub { display: block; color: var(--muted); font-size: 14px; }
.row .right { text-align: right; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; max-width: 40%; }
.row .right strong { display: block; color: var(--ink); font-size: 16px; white-space: nowrap; }
.row .right { min-width: 84px; }
.pbar { height: 5px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--prog); }
/* activity sheet */
.card { display: grid; gap: 12px; padding-block: 4px 10px; }
.back { justify-self: start; border: 0; background: none; color: var(--accent); font: 600 17px var(--font); padding: 8px 0; cursor: pointer; }
.card h2 { margin: 0; font-size: 24px; line-height: 1.15; text-wrap: balance; }
.card .where { color: var(--muted); font-size: 16px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.fact { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.fact small { display: block; color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.fact strong { font-size: 18px; font-variant-numeric: tabular-nums; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.box h3 { margin: 0 0 6px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.box ul { margin: 0; padding-left: 18px; }
.box .note { border: 0; padding: 0; background: none; }
.answers { display: grid; gap: 10px; }
.big { border: 0; border-radius: 14px; padding: 18px 16px; font: 700 20px var(--font); text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #fff; }
.big small { font: 500 14px var(--font); opacity: .9; }
.big.done { background: var(--done); } .big.prog { background: var(--prog); } .big.hold { background: var(--hold); }
.big.sel { outline: 4px solid var(--ink); outline-offset: 2px; }
:root:not([data-theme="light"]) .big { color: #fff; }
.pick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.pick button, .reasons button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 12px 4px; font: 600 16px var(--font); cursor: pointer; }
.pick button.on, .reasons button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.reasons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.men { display: grid; gap: 6px; }
.men .m { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; }
.men .m button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 700 22px var(--font); cursor: pointer; }
.men .m output { min-width: 28px; text-align: center; font: 700 20px var(--font); font-variant-numeric: tabular-nums; }
textarea, input[type=text] { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: 16px var(--font); background: var(--card); color: var(--ink); }
.photo { display: flex; gap: 10px; align-items: center; }
.photo label { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 12px 14px; font-weight: 600; cursor: pointer; }
.photo img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; }
.save { border: 0; border-radius: 14px; padding: 18px; font: 700 20px var(--font); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.save:disabled { opacity: .5; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); }
.upd { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.upd .go { color: var(--muted); font-size: 22px; }
.bigphoto { width: 100%; max-height: 50vh; object-fit: contain; border-radius: 12px; background: var(--card); border: 1px solid var(--line); cursor: zoom-in; }
.viewer { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.92); display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
.viewer span { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); color: #fff; font: 600 16px var(--font); }
.upd img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; }
.upd small { color: var(--muted); }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; color: #fff; font-size: 13px; font-weight: 600; }
.cl { display: grid; gap: 6px; }
.cl h4 { margin: 8px 0 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ck { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: start; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.ck .st { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 14px; }
.ck .st.ok { background: var(--done); border-color: var(--done); } .ck .st.no { background: var(--hold); border-color: var(--hold); } .ck .st.val { background: var(--ready); border-color: var(--ready); font-size: 11px; }
.ck small { display: block; color: var(--muted); font-size: 13px; }
.ck .tag { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.ck .tag.hold { color: var(--hold); border-color: var(--hold); }
.flag { color: var(--hold); font-weight: 600; font-size: 13px; }
.ckform { display: grid; gap: 8px; background: var(--soft); border-radius: 10px; padding: 10px; }
.ckform .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ckform .yn button { border: 0; border-radius: 10px; padding: 14px; font: 700 18px var(--font); color: #fff; cursor: pointer; opacity: .55; }
.ckform .yn button.on { opacity: 1; outline: 3px solid var(--ink); }
.ckform input[type=number] { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: 18px var(--font); background: var(--card); color: var(--ink); }
.loghead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
.loghead button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 8px 12px; font: 600 15px var(--font); cursor: pointer; }
.logrow { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.logrow.bad { border-color: var(--hold); }
.tabs.three { grid-template-columns: 1fr 1fr 1fr; }
.office { margin-top: 26px; border-top: 2px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
.office h2 { margin: 0; font-size: 18px; }
.office .btn { border: 1px solid var(--accent); color: var(--accent); background: var(--card); border-radius: 12px; padding: 14px; font: 600 16px var(--font); cursor: pointer; text-align: left; }
.office .btn small { display: block; color: var(--muted); font-weight: 400; }
.mono { font-family: var(--mono); font-size: 13px; }
button:focus-visible, label:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { .row { transition: transform .08s; } .row:active { transform: scale(.99); } }
</style>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var P = null, C = null, db = null, userNS = null, assets = null, me = null, canEdit = false;
  var updates = [], names = {}, room = "", tab = "today", openAct = null, form = null, planInfo = null;
  var HOLD = ["Client decision change", "Material unavailable", "Labour unavailable", "Other"];
  var HOLDLBL = { "Client decision change": "Client changed it", "Material unavailable": "No material", "Labour unavailable": "No labour", "Other": "Other problem" };

      var keys = Object.keys(form.men);
      if (keys.length && form.kind != "hold") {
        h += '<div class="box"><h3>Men on this work today</h3><div class="men">';
        keys.forEach(function (k, i) { h += '<div class="m"><span>' + esc(k) + '</span><button type="button" data-men="' + i + '" data-d="-1" aria-label="One less">&#8722;</button><output id="men' + i + '">' + form.men[k] + '</output><button type="button" data-men="' + i + '" data-d="1" aria-label="One more">+</button></div>'; });
        h += "</div></div>";
      }
      h += '<label class="box" for="uNote" style="display:grid;gap:6px"><h3 style="margin:0">' + (form.kind == "hold" && form.reason == "Other" ? "What happened? (needed)" : "Note (if any)") + '</h3><textarea id="uNote" rows="2">' + esc(form.note) + "</textarea></label>";
      h += '<div class="photo"><label for="uPhoto">Add photo</label><input id="uPhoto" type="file" accept="image/*" capture="environment" hidden>' + (form.photo ? '<img alt="Photo to send" src="' + form.photo + '">' : '<span class="where">optional</span>') + "</div>";
      h += '<button type="button" class="save" id="uSave">Save update</button>';
    }
    $("sheetIn").innerHTML = h;
    fillWho();
  }
  function shrinkPhoto(file) {
    return new Promise(function (res, rej) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var k = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        var q = 0.7, d = c.toDataURL("image/jpeg", q);
        while (d.length > 180000 && q > 0.3) { q -= 0.1; d = c.toDataURL("image/jpeg", q); }
        res(d);
      };
      img.onerror = rej; img.src = url;
    });
  }
  async function save() {
    var a = openAct, kind = form.kind == "hold" ? form.reason : form.kind;
    form.note = ($("uNote") && $("uNote").value || "").trim();
    if (!kind) { toast("Tap what the problem is."); return; }
    if (kind == "Other" && !form.note) { toast("Write a few words about the problem."); return; }
    if (kind == "Done" && !form.holdOk) {
      var open = ckList(a).filter(function (k) { var c = lastCheck(a.id, k[0]); return k[4] == "Y" && (!c || c.ans == "No"); });
      if (open.length) { form.holdOk = true; toast(open.length + " hold point" + (open.length > 1 ? "s are" : " is") + " not OK yet. Tap Save again to finish anyway."); return; }
    }
    if (!db) { toast("Saving is not available on this link. Ask the office for access."); return; }
    var b = $("uSave"); b.disabled = true; b.textContent = "Saving...";
    var body = { act: a.id, kind: kind, at: new Date().toISOString() };
    if (kind == "In progress") body.pct = form.pct; else if (kind == "Done") body.pct = 100;
    if (form.note) body.note = form.note;
    if (kind == "Done" || kind == "In progress") { var m = {}; Object.keys(form.men).forEach(function (k) { if (form.men[k] > 0) m[k] = form.men[k]; }); if (Object.keys(m).length) body.men = m; }
    if (me) body.by = me;
    try {
      body.srv = await serverTime();
      if (form.photo) { var ph = await db.collection("photos").add({ data: form.photo, act: a.id, at: body.at }); body.photo = ph.id; if (form.photoTaken) body.photoTaken = form.photoTaken; }
      await db.collection("updates").add(body);
      toast("Saved: " + a.desc + " - " + (kind == "Done" ? "finished" : kind == "In progress" ? form.pct + "% done" : HOLDLBL[kind]));
      closeCard();
    } catch (e) {
      b.disabled = false; b.textContent = "Save update";
      if (e && (e.code == "permission_denied" || e.code == "not_granted")) toast("This link can't save updates. Ask the office to give you edit (Contributor) access.");
      else if (e && e.code == "quota_exceeded") toast("The update store is full. Ask the office to clear old photos.");
      else toast("Not saved - check the internet and tap Save again.");
    }
  }

  /* ---------- office: send plan, download updates ---------- */
  function renderOffice() {
    var o = $("office");
    if (!canEdit) { o.hidden = true; return; }
    o.hidden = false;
    var since = planInfo && planInfo.at ? updates.filter(function (u) { return u.at >= planInfo.at; }).length : updates.length;
    o.innerHTML = "<h2>Office</h2>" +
      '<label class="btn" for="planFile">Send today\'s plan and model<small>Choose both <span class="mono">RPQS_phone.json</span> and <span class="mono">RPQS_model.json</span> from the project folder (SketchUp writes them on every Sync). ' +
      (P ? "Last sent: " + esc(P.made) + "." : "Not sent yet.") + '</small></label><input id="planFile" type="file" accept=".json,application/json" multiple hidden>' +
      '<button type="button" class="btn" id="getCsv">Download site updates for Excel<small>' + updates.length + " updates in all, " + since + " since the last plan. Saves <span class=\"mono\">RPQS_site_updates.csv</span>; SketchUp picks it up from Downloads on the next Sync.</small></button>";
  }
  async function sendPlan(files) {
    try {
      if (!assets) { toast("Only the owner or an editor can send the plan."); return; }
      var plan = null, planTxt = "", modelTxt = "";
      for (var i = 0; i < files.length; i++) {
        var txt = await files[i].text(), j = null;
        try { j = JSON.parse(txt); } catch (e) { continue; }
        if (j && j.app == "rpqs-site-1" && j.cpm) { plan = j; planTxt = txt; }
        else if (j && j.format == "remwo-web-1") modelTxt = txt;
      }
      if (!plan && !modelTxt) { toast("Pick RPQS_phone.json and RPQS_model.json from the project folder."); return; }
      toast("Sending...");
      var doc = { at: new Date().toISOString() };
      if (planInfo && planInfo.asset) { doc.asset = planInfo.asset; doc.made = planInfo.made; }
      if (planInfo && planInfo.model) doc.model = planInfo.model;
      if (plan) { var up = await assets.upload(new Blob([planTxt], { type: "application/json" }), { type: "application/json" }); doc.asset = up.id; doc.made = plan.made; }
      if (modelTxt) { var um = await assets.upload(new Blob([modelTxt], { type: "application/json" }), { type: "application/json" }); doc.model = um.id; }
      if (!doc.asset) { toast("Also pick RPQS_phone.json - the phone needs today's plan."); return; }
      await db.doc("plan/current").set(doc);
      toast((plan ? "Plan" : "") + (plan && modelTxt ? " and model" : modelTxt ? "Model" : "") + " sent. The site phone shows it now.");
    } catch (e) { toast("Not sent: " + (e && e.message ? e.message : "try again")); }
  }
  async function getCsv() {
    var dl = await claude.use("downloads");
    if (!dl) { toast("Download is not available here. Open this page in a browser on the office PC."); return; }
    var q = function (v) { v = v == null ? "" : String(v); return '"' + v.replace(/"/g, '""') + '"'; };
    var lines = ["Date,Time,Element ID,Activity ID,Update,% complete,Piece % after update,Note,By,Men today,Photo"], photos = [];
    function pname(u) { var d = new Date(u.at), z = function (n) { return (n < 10 ? "0" : "") + n; }; return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + "_" + z(d.getHours()) + z(d.getMinutes()) + "_" + u.act + "_" + u.photo + ".jpg"; }
    var asc = updates.slice().sort(function (a, b) { return a.at < b.at ? -1 : 1; }), run = {};
    asc.forEach(function (u) {
      if (u.kind == "Done") run[u.act] = 100; else if (u.kind == "In progress") run[u.act] = u.pct || 0;
      var d = new Date(u.at), els = (P && P.els[u.act] && P.els[u.act].length) ? P.els[u.act] : [u.act];
      var men = u.men ? Object.keys(u.men).map(function (k) { return u.men[k] + " " + k; }).join("; ") : "";
      els.forEach(function (el) {
        lines.push([q(d.toLocaleDateString("en-GB")), q(d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })), q(el), q(u.act), q(u.kind),
          q(u.pct == null ? "" : u.pct), q(run[u.act] || 0), q(u.note || ""), q(names[u.by] || "Site"), q(men), q(u.photo ? pname(u) : "")].join(","));
      });
      if (u.photo) photos.push(u);
    });
    var ckRows = checks.slice().sort(function (x, y) { return tOf(x) < tOf(y) ? -1 : 1; });
    if (ckRows.length) {
      lines.push("#CHECKS");
      lines.push("Date,Time (server),Activity ID,Check no,Stage,Check point,Answer,Value,Remark,By,Phone time,Warnings,Photo");
      ckRows.forEach(function (c) {
        var d = new Date(tOf(c)), pn = c.photo ? pname({ at: c.at, act: c.act + "_" + c.check, photo: c.photo }) : "";
        lines.push([q(d.toLocaleDateString("en-GB")), q(c.srv ? hhmm(c.srv) : ""), q(c.act), q(c.check), q(STG[c.stage] || c.stage), q(c.text || ""), q(c.ans == "No" ? "Not OK" : c.ans == "Yes" ? "OK" : c.ans),
          q(c.val == null ? "" : c.val), q(c.note || ""), q(names[c.by] || "Site"), q(hhmm(c.at)), q(flagsOf(c).join("; ")), q(pn)].join(","));
        if (c.photo) photos.push({ at: c.at, act: c.act + "_" + c.check, photo: c.photo });
      });
    }
    if (photos.length) {
      toast("Collecting " + photos.length + " photos...");
      lines.push("#PHOTOS");
      for (var k = 0; k < photos.length; k++) {
        var u2 = photos[k], data = photoCache[u2.photo];
        if (!data || data == "none") { try { var ph = await db.doc("photos/" + u2.photo).get(); data = ph.exists ? ph.data().data : ""; photoCache[u2.photo] = data || "none"; } catch (e) { data = ""; } }
        if (data && data != "none") lines.push(pname(u2) + "," + String(data).replace(/^data:[^,]*,/, ""));
      }
    }
    var stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, "");
    try { await dl.save({ filename: "RPQS_site_updates_" + stamp + ".csv", data: lines.join("\r\n") }); toast("Saved" + (photos.length ? " with " + photos.length + " photos" : "") + ". Now Sync in SketchUp."); }
    catch (e) { if (e && e.code != "declined") toast("Download failed - try again."); }
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (ev) {
    if (ev.target.id == "bigPhoto") { showPhoto(ev.target.src); return; }
    var b = ev.target.closest("button"); if (!b) return;
    if (b.dataset.room != null) { room = b.dataset.room; if (openAct) closeCard(); else render(); fitCurrent(); return; }
    if (b.dataset.act) { openCard(b.dataset.act); return; }
    if (b.id == "back") { closeCard(); return; }
    if (b.dataset.upd) { openUpdate(b.dataset.upd); return; }
    if (b.id == "tToday") { tab = "today"; render(); return; }
    if (b.id == "tDone") { tab = "done"; render(); return; }
    if (b.id == "tCk") { tab = "ck"; render(); return; }
    if (b.id == "logPrev") { logDay--; renderLog(); return; }
    if (b.id == "logNext") { if (logDay < 0) logDay++; renderLog(); return; }
    if (b.id == "getCsv") { getCsv(); return; }
    if (!openAct) return;
    if (b.dataset.kind) { form.note = ($("uNote") && $("uNote").value) || form.note; form.kind = b.dataset.kind; drawCard(); return; }
    if (b.dataset.pct) { form.pct = +b.dataset.pct; drawCard(); return; }
    if (b.dataset.reason) { form.note = ($("uNote") && $("uNote").value) || form.note; form.reason = b.dataset.reason; drawCard(); return; }
    if (b.dataset.men) { var k = Object.keys(form.men)[+b.dataset.men]; form.men[k] = Math.max(0, form.men[k] + (+b.dataset.d)); $("men" + b.dataset.men).textContent = form.men[k]; return; }
    if (b.id == "uSave") save();
    if (b.dataset.ck) { var keepNote = $("uNote") ? $("uNote").value : ""; form.note = keepNote || form.note; ckOpen = ckOpen == b.dataset.ck ? "" : b.dataset.ck; ckForm = { ans: "", val: "", note: "", photo: null, photoTaken: "" }; drawCard(); return; }
    if (b.dataset.ckans) { if ($("ckNote")) ckForm.note = $("ckNote").value; if ($("ckVal")) ckForm.val = $("ckVal").value; ckForm.ans = b.dataset.ckans; drawCard(); return; }
    if (b.id == "ckSave") saveCheck();
  });
  document.addEventListener("change", async function (ev) {
    var t = ev.target;
    if (t.id == "planFile" && t.files.length) { sendPlan(Array.prototype.slice.call(t.files)); t.value = ""; }
    if (t.id == "uPhoto" && t.files[0]) {
      form.note = ($("uNote") && $("uNote").value) || form.note;
      try { form.photoTaken = await exifDate(t.files[0]); form.photo = await shrinkPhoto(t.files[0]); drawCard(); } catch (e) { toast("That photo could not be read."); }
    }
    if (t.id == "ckPhoto" && t.files[0] && ckForm) {
      if ($("ckNote")) ckForm.note = $("ckNote").value; if ($("ckVal")) ckForm.val = $("ckVal").value;
      try { ckForm.photoTaken = await exifDate(t.files[0]); ckForm.photo = await shrinkPhoto(t.files[0]); drawCard(); } catch (e) { toast("That photo could not be read."); }
    }
  });

  /* ---------- start ---------- */
  async function loadPlan(info) {
    planInfo = info || {};
    if (!info || !info.asset) { P = null; C = null; render(); $("msg").textContent = "No plan sent yet."; return; }
    try {
      var r = await fetch("/_blob/" + info.asset); if (!r.ok) throw new Error(r.status);
      P = await r.json(); C = P.cpm;
    } catch (e) { P = null; C = null; toast("Could not load the plan - check the internet."); }
    render();
    if (info.model && info.model != modelId) {
      $("msg").hidden = false; $("msg").textContent = "Loading the model...";
      try { var rm = await fetch("/_blob/" + info.model); if (!rm.ok) throw new Error(rm.status); M = await rm.json(); modelId = info.model; buildModel(M); }
      catch (e) { $("msg").textContent = "The model could not be loaded - check the internet and reopen the page."; }
    } else if (!info.model) { $("msg").hidden = false; $("msg").textContent = "No model sent yet. In the office: Send today's plan with RPQS_model.json."; }
    if (openAct) { var a = find(openAct.id); if (a) { openAct = a; a._st = stateOf(a); } }
  }
  async function resolveNames() {
    if (!userNS) return;
    var ids = []; updates.forEach(function (u) { if (u.by && ids.indexOf(u.by) < 0) ids.push(u.by); });
    if (!ids.length) return;
    try { var ps = await userNS.profiles(ids); ids.forEach(function (id) { names[id] = (ps[id] && ps[id].name) || "Someone"; }); } catch (e) { }
  }
  async function start() {
    render();
    if (!window.claude || !claude.use) { planInfo = {}; render(); return; }
    db = await claude.use("db");
    userNS = await claude.use("user");
    if (userNS) {
      try { me = await userNS.id(); } catch (e) { }
      try { canEdit = await userNS.canEdit(); } catch (e) { canEdit = false; }
      try { var p = await userNS.me(); if (p && p.name) $("who").textContent = p.name; } catch (e) { }
    }
    if (canEdit) assets = await claude.use("assets");
    if (!db) { planInfo = {}; $("main").innerHTML = '<div class="note">Open this from the REMWO Site bot in Telegram.</div>'; renderOffice(); return; }
    db.doc("plan/current").onSnapshot(function (snap) { loadPlan(snap.exists ? snap.data() : null); }, function () { planInfo = {}; render(); });
    var gotUpdates = async function (snap) {
      updates = snap.docs.map(function (d) { var x = Object.assign({}, d.data() || {}); x._id = d.id; return x; }).filter(function (u) { return u && u.act && u.kind && u.at; });
      updates.sort(function (a, b) { return a.at < b.at ? 1 : a.at > b.at ? -1 : 0; });
      if (!openAct) render(); else renderOffice();
      resolveNames().then(function () { if (!openAct && tab == "done") renderUpdates(); }).catch(function () { });
    };
    db.collection("updates").onSnapshot(gotUpdates, function (e) {
      toast("Updates could not be loaded (" + (e && e.code ? e.code : "error") + "). Reload the page.");
      db.collection("updates").get().then(gotUpdates).catch(function () { });
    });
    db.collection("updates").get().then(gotUpdates).catch(function (e) { toast("Updates could not be read (" + (e && e.code ? e.code : "error") + ")."); });
    var gotChecks = function (snap) {
      checks = snap.docs.map(function (d) { var x = Object.assign({}, d.data() || {}); x._id = d.id; return x; }).filter(function (c) { return c && c.act && c.check && c.at; });
      var ids = []; checks.forEach(function (c) { if (c.by && !names[c.by] && ids.indexOf(c.by) < 0) ids.push(c.by); });
      if (ids.length && userNS) userNS.profiles(ids).then(function (ps) { ids.forEach(function (id) { names[id] = (ps[id] && ps[id].name) || "Someone"; }); fillWho(); }).catch(function () { });
      if (openAct && !openUpd && !ckOpen) drawCard(); else if (!openAct) render();
    };
    db.collection("checks").onSnapshot(gotChecks, function () { db.collection("checks").get().then(gotChecks).catch(function () { }); });
  }
  start();
})();
</script>
